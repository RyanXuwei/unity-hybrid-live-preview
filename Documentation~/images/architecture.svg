<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="460" rx="16" fill="#f8fafc"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">How Hybrid Live Preview works</text>
  <text x="32" y="68" font-size="13" fill="#475569">Everything runs on your machine while the Editor is in Play Mode. Nothing here ships in a player build.</text>

  <!-- Unity Editor -->
  <rect x="32" y="96" width="330" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="126" font-size="15" font-weight="700" fill="#0f172a">Unity Editor (Play Mode)</text>
  <rect x="52" y="142" width="290" height="74" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="66" y="166" font-size="13" font-weight="600" fill="#1e3a8a">PreviewStreamer</text>
  <text x="66" y="186" font-size="12" fill="#334155">Mirror of Camera.main → WebRTC video track</text>
  <text x="66" y="204" font-size="12" fill="#334155">Size follows the browser window</text>
  <rect x="52" y="228" width="290" height="74" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="66" y="252" font-size="13" font-weight="600" fill="#14532d">RemoteInput</text>
  <text x="66" y="272" font-size="12" fill="#334155">Virtual Mouse / Keyboard / Touchscreen</text>
  <text x="66" y="290" font-size="12" fill="#334155">→ Input System → your scripts and UI</text>
  <rect x="52" y="314" width="290" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="66" y="338" font-size="13" font-weight="600" fill="#0f172a">Editor tooling</text>
  <text x="66" y="358" font-size="12" fill="#334155">Starts Vite and Chrome on Play, stops on Stop</text>
  <text x="66" y="376" font-size="12" fill="#334155">Locks the Game view to the stream size</text>
  <text x="66" y="394" font-size="12" fill="#334155">Keeps src/hlp/ in sync with the package</text>

  <!-- Vite -->
  <rect x="404" y="176" width="170" height="132" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="420" y="204" font-size="15" font-weight="700" fill="#0f172a">Vite dev server</text>
  <text x="420" y="226" font-size="12" fill="#334155">127.0.0.1:5173</text>
  <text x="420" y="250" font-size="12" fill="#334155">Serves your web UI</text>
  <text x="420" y="268" font-size="12" fill="#334155">with hot reload</text>
  <text x="420" y="290" font-size="12" fill="#334155">/signaling WebSocket</text>

  <!-- Chrome -->
  <rect x="616" y="96" width="312" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="636" y="126" font-size="15" font-weight="700" fill="#0f172a">Chrome</text>
  <rect x="636" y="142" width="272" height="264" rx="8" fill="#0f172a"/>
  <polygon points="700,330 760,300 820,330 760,360" fill="#334155"/>
  <polygon points="700,330 760,360 760,392 700,362" fill="#1e293b"/>
  <polygon points="820,330 760,360 760,392 820,362" fill="#475569"/>
  <text x="652" y="166" font-size="12" fill="#cbd5e1">&lt;video&gt; Unity 3D stream</text>
  <rect x="652" y="180" width="128" height="26" rx="13" fill="#1f2937" stroke="#334155"/>
  <circle cx="668" cy="193" r="4" fill="#22c55e"/>
  <text x="680" y="197" font-size="11" fill="#e2e8f0">LIVE 1280×720 ▸</text>
  <rect x="770" y="222" width="126" height="74" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <text x="782" y="244" font-size="12" font-weight="600" fill="#0f172a">#app</text>
  <text x="782" y="262" font-size="11" fill="#334155">your HTML/CSS/JS</text>
  <rect x="782" y="272" width="72" height="14" rx="4" fill="#2563eb"/>

  <!-- arrows -->
  <path d="M342,180 C380,180 380,214 404,214" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M574,214 C600,214 600,180 616,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="160" font-size="11" fill="#475569">signaling (offer / answer / ICE)</text>

  <path d="M342,160 C470,120 520,120 636,150" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="430" y="114" font-size="12" font-weight="600" fill="#2563eb">WebRTC video (VP8, ~60 fps)</text>

  <path d="M636,380 C520,410 470,410 342,268" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="404" y="420" font-size="12" font-weight="600" fill="#16a34a">WebRTC data channel "input": pointer · wheel · keys · touch</text>
</svg>
